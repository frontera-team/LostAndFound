services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lostandfound
      POSTGRES_PASSWORD: lostandfound
      POSTGRES_DB: lostandfound
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lostandfound -d lostandfound']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.development
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://lostandfound:lostandfound@db:5432/lostandfound
    ports:
      - '8001:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
