services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lostandfound
      POSTGRES_PASSWORD: lostandfound
      POSTGRES_DB: lostandfound
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lostandfound -d lostandfound']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.development
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://lostandfound:lostandfound@db:5432/lostandfound
      GOOGLE_OAUTH_CLIENT_ID: 336822626552-j2c04i6j2lgu75ar2c0ctmjpbm74oee1.apps.googleusercontent.com
      # Фото для сида демо-объявлений (рядом с репозиторием лежит poteryashki_maket/uploads)
      SEED_UPLOADS_DIR: /seed-uploads
    ports:
      - '8001:8000'
    volumes:
      - ../poteryashki_maket/uploads:/seed-uploads:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
